<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TTL — Play</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#05060a;
  --bg2:#0b1020;
  --card:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.1);
  --text:#e5e7eb;
  --muted:#9ca3af;
  --accent:#7c3aed;
  --accent2:#22c55e;
  --danger:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,system-ui,sans-serif;
}

html {
  overflow-x:hidden;
}

body{
  min-height:100vh;
  overflow-y:auto;
  overflow-x:hidden;
  background: radial-gradient(circle at top, #1a0b2e, var(--bg1), #000);
  color:var(--text);
}

.bg-glow{
  position:fixed;
  width:600px;
  height:600px;
  background: radial-gradient(circle, rgba(124,58,237,0.25), transparent 60%);
  top:-200px;
  left:-200px;
  filter:blur(60px);
  animation: float 8s ease-in-out infinite;
}

.bg-glow2{
  position:fixed;
  width:500px;
  height:500px;
  background: radial-gradient(circle, rgba(34,197,94,0.15), transparent 60%);
  bottom:-200px;
  right:-200px;
  filter:blur(60px);
  animation: float 10s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(30px)}
}

.app{
  position:relative;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:84px 20px 40px;
}

.brand{
  position:absolute;
  top:20px;
  left:0;
  right:0;
  text-align:center;
  font-weight:800;
  letter-spacing:2px;
  opacity:0.75;
  user-select:none;
}

.screen{
  width:100%;
  max-width:420px;
  animation: fade 0.35s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(10px)}
  to{opacity:1; transform:translateY(0)}
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid var(--stroke);
  border-radius:24px;
  padding:20px;
  backdrop-filter: blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,0.6);
}

.story-title{
  font-size:22px;
  font-weight:800;
  text-align:center;
  margin-bottom:12px;
  letter-spacing:-0.6px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin-top:8px;
  font-size:13px;
  line-height:1.5;
}

button{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:none;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
  transition:transform .18s ease, opacity .18s ease, box-shadow .18s ease;
}

button:hover{ transform:translateY(-1px); }
button:active{ transform:translateY(0); opacity:.92; }

.primary{
  background:linear-gradient(135deg,var(--accent),#4f46e5);
  color:white;
  box-shadow:0 14px 30px rgba(124,58,237,0.22);
}

.secondary{
  background:rgba(255,255,255,0.06);
  color:var(--text);
  border:1px solid var(--stroke);
}

.option{
  padding:14px;
  margin:10px 0;
  border-radius:16px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--stroke);
  cursor:pointer;
  transition:0.2s;
  line-height:1.45;
  overflow-wrap: anywhere;
}

.option:hover{
  transform:scale(1.02);
  border-color:rgba(124,58,237,0.6);
}

.option.correct{
  border-color:rgba(34,197,94,0.95);
  background:rgba(34,197,94,0.14);
}

.option.wrong{
  border-color:rgba(239,68,68,0.95);
  background:rgba(239,68,68,0.14);
}

.result{
  text-align:center;
  /* margin-top:16px; */
  font-weight:700;
  /* min-height:24px; */
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:999px;
  margin-top:10px;
  font-size:13px;
}

.good{background:rgba(34,197,94,0.15); color:#22c55e;}
.bad{background:rgba(239,68,68,0.15); color:#fca5a5;}

.answer-meta{
  margin-top:14px;
  padding:14px;
  border-radius:18px;
  background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
  border:1px solid var(--stroke);
}

.answer-meta-label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:.12em;
}

.answer-meta-title{
  font-size:18px;
  font-weight:800;
  line-height:1.35;
  margin-bottom:8px;
}

.creator-line{
  font-size:12px;
  color:var(--muted);
  margin-bottom:12px;
}

.footer{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  margin-top:12px;
}

.divider{
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  margin:16px 0;
}

.small{
  font-size:12px;
  color:var(--muted);
  word-break:break-all;
  line-height:1.5;
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow2"></div>
<div class="brand">TTL</div>

<div class="app">
  <div class="screen">
    <div class="card">
      <div class="story-title">Can you spot the lie?</div>
      <div class="subtitle">Tap the statement you think is false. You can keep trying as many times as you want.</div>

      <div class="answer-meta">
        <div class="answer-meta-label">Challenge</div>
        <div class="answer-meta-title">Which one is the lie?</div>
        <div id="creatorNameDisplay" class="creator-line"></div>
        <div id="options"></div>
      </div>

      <div id="result" class="result"></div>

      <div class="divider"></div>
      <button class="primary" onclick="goToCreate()">Create Your Own Challenge</button>
      <!-- <button class="secondary" onclick="playAgain()">Play Another</button> -->

      <div class="footer">No login • Instant share • WhatsApp ready</div>
    </div>
  </div>
</div>

<script>
function decode(d){
  return JSON.parse(decodeURIComponent(escape(atob(d))));
}

const state = {
  optionsNode: null,
  resultNode: null
};

function goToCreate(){
  location.href = 'index.html';
}

function playAgain(){
  const url = new URL(location.href);
  url.hash = '';
  location.href = url.toString();
}

function loadGame(data){
  state.optionsNode = document.getElementById('options');
  state.resultNode = document.getElementById('result');

  const creatorNameDisplay = document.getElementById('creatorNameDisplay');
  creatorNameDisplay.textContent = data.creatorName
    ? `Created by ${data.creatorName}`
    : 'Created by Anonymous';

  const opts = shuffle([
    { t: data.t1, type: 'truth' },
    { t: data.t2, type: 'truth' },
    { t: data.l1, type: 'lie' }
  ]);

  state.optionsNode.innerHTML = '';
  state.resultNode.innerHTML = '';

  opts.forEach((o) => {
    const el = document.createElement('div');
    el.className = 'option';
    el.innerText = o.t;

    el.onclick = () => {
      if (o.type === 'lie') {
        el.classList.add('correct');
        state.resultNode.innerHTML = `<div class="badge good">Correct 🎉</div><div class="small" style="margin-top:10px;">You found the lie. Tap any option again if you want to keep exploring.</div>`;
      } else {
        el.classList.add('wrong');
        state.resultNode.innerHTML = `<div class="badge bad">Wrong ❌</div><div class="small" style="margin-top:10px;">That one is a truth. Try another one.</div>`;
      }
    };

    state.optionsNode.appendChild(el);
  });
}

function shuffle(a){
  return a.sort(() => Math.random() - 0.5);
}

(function init(){
  const hash = location.hash;
  if(hash.includes('data=')){
    try{
      const data = decode(hash.split('data=')[1]);
      loadGame(data);
    }catch(e){
      document.getElementById('result').innerHTML = `<div class="badge bad">Invalid link</div>`;
    }
  }else{
    document.getElementById('result').innerHTML = `<div class="badge bad">No challenge loaded</div>`;
  }
})();
</script>

</body>
</html>
